name: publish-securebuild

on:
  push:
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. 1.19.6)'
        required: true
        type: string

jobs:
  build-package:
    runs-on: ubuntu-22.04
    continue-on-error: true
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Install securebuild CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/securebuildhq/securebuild/releases/latest | jq -r .tag_name)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::error::Failed to determine latest securebuild release tag"
            exit 1
          fi
          curl -sfL "https://github.com/securebuildhq/securebuild/releases/download/${LATEST_TAG}/securebuild-cli-linux-amd64" -o securebuild
          file securebuild | grep -q 'ELF' || { echo "::error::Downloaded file is not a valid binary"; cat securebuild; exit 1; }
          chmod +x securebuild

      - name: Build package
        run: |
          ./securebuild build package \
            --package-family-name replicated-sdk \
            --tag ${{ steps.version.outputs.version }} \
            --api-token "${{ secrets.SECUREBUILD_API_TOKEN }}"

  build-image:
    needs: build-package
    runs-on: ubuntu-22.04
    continue-on-error: true
    if: needs.build-package.result == 'success'
    strategy:
      matrix:
        image-name:
        - replicated-sdk
        - replicated-sdk-fips
    steps:
      - name: Install securebuild CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/securebuildhq/securebuild/releases/latest | jq -r .tag_name)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::error::Failed to determine latest securebuild release tag"
            exit 1
          fi
          curl -sfL "https://github.com/securebuildhq/securebuild/releases/download/${LATEST_TAG}/securebuild-cli-linux-amd64" -o securebuild
          file securebuild | grep -q 'ELF' || { echo "::error::Downloaded file is not a valid binary"; cat securebuild; exit 1; }
          chmod +x securebuild

      - name: Build image
        run: |
          ./securebuild build image \
            --image-name ${{ matrix.image-name }} \
            --tag ${{ needs.build-package.outputs.version }} \
            --api-token "${{ secrets.SECUREBUILD_API_TOKEN }}"
