name: publish
on:
  push:
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+-beta'
    - '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+-alpha'
    - '[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'

env:
  PACT_VERSION: ${{ github.ref_name }}
  PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  GIT_TAG: ${{ github.ref_name }}

jobs:
  publish-pact:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: replicatedhq/action-install-pact@main
      - name: Run pact tests
        run: make test-pact
      - name: Publish pact
        run: |
          pact-broker publish ./pacts \
            --consumer-app-version ${{ github.ref_name }} \
            --branch main \
            --verbose
      - name: Record release
        run: |
          pact-broker record-release \
            --pacticipant replicated-sdk \
            --version ${{ github.ref_name }} \
            --environment production \
            --verbose

  get-tags:
    runs-on: ubuntu-22.04
    outputs:
      previous-tag: ${{ steps.get-tags.outputs.previous-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get tags
        id: get-tags
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const {
                data: [previous],
              } = await github.rest.repos.listReleases({
                ...context.repo,
                per_page: 1,
                page: 1,
              });
              core.setOutput("previous-tag", previous.tag_name.replace(/^v/, ''));
            } catch (error) {
              core.setFailed("Failed to get previous release tag: " + error.message);
            }

  generate-release-notes-pr:
    runs-on: ubuntu-22.04
    needs: [get-tags]
    if: github.ref_type != 'branch'
    steps:
    - uses: depot/setup-action@v1

    - name: Generate Release Notes PR
      env:
        GIT_PREV_TAG: ${{ needs.get-tags.outputs.previous-tag }}
        DEPOT_CI_DISPATCH_TOKEN: ${{ secrets.DEPOT_CI_DISPATCH_TOKEN }}
      run: |
        depot ci dispatch \
          --repo replicatedhq/replicated-docs \
          --workflow release-notes.yml \
          --ref main \
          --input event_type=replicated-sdk-release-notes \
          --input "version=$GIT_TAG" \
          --input "prev_version=$GIT_PREV_TAG" \
          --input dry_run=false \
          --token "$DEPOT_CI_DISPATCH_TOKEN"

  build-securebuild:
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/publish-securebuild.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  staging:
    needs: build-securebuild
    if: ${{ !cancelled() && (contains(github.ref_name, '-') || needs.build-securebuild.result == 'success') }}
    runs-on:
      labels: ReplicatedSDK
    outputs:
      digest: ${{ steps.dagger-publish.outputs.stdout }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - uses: dagger/dagger-for-github@v8.4.1
        id: dagger-publish
        env:
          OP_SERVICE_ACCOUNT: ${{ secrets.OP_SERVICE_ACCOUNT }}
          OP_SERVICE_ACCOUNT_PRODUCTION: ${{ secrets.OP_SERVICE_ACCOUNT_PRODUCTION }}
        with:
          version: "0.21.7"
          verb: call
          args: publish --progress=plain --op-service-account=env:OP_SERVICE_ACCOUNT --op-service-account-production=env:OP_SERVICE_ACCOUNT_PRODUCTION --dev=false --staging=true --skip-image=${{ !contains(github.ref_name, '-') }} --version ${{ github.ref_name }}

  production:
    needs: build-securebuild
    if: ${{ !cancelled() && (contains(github.ref_name, '-') || needs.build-securebuild.result == 'success') }}
    runs-on:
      labels: ReplicatedSDK
    outputs:
      digest: ${{ steps.dagger-publish.outputs.stdout }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - uses: dagger/dagger-for-github@v8.4.1
        id: dagger-publish
        env:
          OP_SERVICE_ACCOUNT: ${{ secrets.OP_SERVICE_ACCOUNT }}
          OP_SERVICE_ACCOUNT_PRODUCTION: ${{ secrets.OP_SERVICE_ACCOUNT_PRODUCTION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "0.21.7"
          verb: call
          args: publish --progress=plain --op-service-account=env:OP_SERVICE_ACCOUNT --op-service-account-production=env:OP_SERVICE_ACCOUNT_PRODUCTION --dev=false --production=true --skip-image=${{ !contains(github.ref_name, '-') }} --version ${{ github.ref_name }} --github-token=env:GITHUB_TOKEN
