name: Build a SecureBuild image locally
description: Publish an image locally from a SecureBuild APKO spec and local Melange packages

inputs:
  config:
    description: Path to the SecureBuild APKO config
    required: true
  archs:
    description: Image architectures
    default: amd64,arm64
  keyring:
    description: Local package signing public keys
    default: ./melange-amd64.rsa.pub,./melange-arm64.rsa.pub
  sbom-path:
    description: Directory for generated SPDX SBOMs
    default: ./sbom
  image-name:
    description: Full destination image name
    required: true
  registry-username:
    description: Username used to log in to the registry
    default: ''
    required: false
  registry-password:
    description: Password used to log in to the registry
    default: ''
    required: false

outputs:
  digest:
    description: Published image digest
    value: ${{ steps.publish.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: securebuild-melange-packages-*
        path: ./packages/
        merge-multiple: true

    - uses: actions/download-artifact@v8
      with:
        pattern: securebuild-melange-rsa-pub-*
        merge-multiple: true

    - name: Create SBOM directory
      shell: bash
      env:
        SBOM_PATH: ${{ inputs.sbom-path }}
      run: mkdir -p "$SBOM_PATH"

    - id: publish
      uses: chainguard-images/actions/apko-publish@v1.0.37
      with:
        config: ${{ inputs.config }}
        archs: ${{ inputs.archs }}
        tag: ${{ inputs.image-name }}
        repository-append: ./packages
        keyring-append: ${{ inputs.keyring }}
        sbom-path: ${{ inputs.sbom-path }}
        vcs-url: true
        generic-user: ${{ inputs.registry-username }}
        generic-pass: ${{ inputs.registry-password }}
